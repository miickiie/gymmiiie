<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#090b0e" />
    <script>
      // Apply the last theme before the first paint to avoid a theme flash.
      (() => {
        try {
          const theme = localStorage.getItem('gymmiie:theme');
          const themeColors = {
            dark: '#090b0e',
            volt: '#000000',
            abyss: '#070d19',
            solar: '#120f0d',
            light: '#f1f5f9',
            dune: '#f5f5f4'
          };
          if (!theme || !(theme in themeColors)) return;
          const root = document.documentElement;
          const light = theme === 'light' || theme === 'dune';
          root.dataset.theme = theme;
          root.classList.toggle('light', light);
          root.classList.toggle('dark', !light);
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', themeColors[theme]);
        } catch {
          /* Keep the default dark theme when storage is unavailable. */
        }
      })();
    </script>
    <meta name="description" content="Gymmiie — an offline-first gym log for the web. Tap muscles, log sets, watch the numbers go up." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Gymmiie — Lift. Log it. Grow.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
