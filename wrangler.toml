name = "gymmiie"
main = "worker/index.ts"
compatibility_date = "2024-12-05"

[vars]
AI_ENABLED = "true"

[ai]
binding = "AI"

# Single Worker: static SPA, account snapshots, and legacy encrypted sync.
[secrets]
required = ["REGISTRATION_PASSPHRASE"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "gymmiie"
database_id = "799cd448-362e-4a54-b2e1-e1f0407458e9"
migrations_dir = "migrations"

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01
